name: DDBOT-AI Preview

on:
  workflow_run:
    workflows: ["DDBOT-AI CI"]
    types: [completed]
    branches: [next-dev]

permissions:
  contents: write
  actions: read

jobs:
  release-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download pure Go artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$REPO" --dir artifacts

      - name: Package preview assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for artifact_dir in artifacts/ddbot-ai-*-lite; do
            name=$(basename "$artifact_dir")
            binary=$(find "$artifact_dir" -maxdepth 1 -type f | head -n 1)
            if [ -z "$binary" ]; then
              echo "No binary found in $artifact_dir" >&2
              exit 1
            fi
            zip -j "release-assets/${name}.zip" "$binary"
          done
          test -n "$(find release-assets -type f -name '*.zip' -print -quit)"
          ls -la release-assets

      - name: Generate release notes
        env:
          COMMIT_ID: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          {
            echo "# DDBOT-AI Preview"
            echo
            echo "纯 Go Lite 预览制品，FFmpeg 作为独立 Runtime 的 Full 制品将在发行流水线完成后提供。"
            echo
            echo "- Commit: [${COMMIT_ID}](${RUN_URL})"
            echo "- CI Run: [View run](${RUN_URL})"
            echo
            echo "## Assets"
            for asset in release-assets/*.zip; do
              echo "- $(basename "$asset")"
            done
          } > RELEASE_NOTES.md

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-next-dev
          name: DDBOT-AI Preview (next-dev)
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: true
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: false
          update_existing: true
