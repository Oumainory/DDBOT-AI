name: DDBOT-AI CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

env:
  GO_VERSION: '1.26.2'
  BASELINE_COMMIT: 'a6364e7182ec4eee93dd78e09fe7a7efd92bffab'

jobs:
  frontend:
    name: Frontend typecheck, tests and deterministic build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify committed embedded artifact
        run: git diff --exit-code -- internal/webui/dist

  test:
    name: Tests and compatibility inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests without CGO
        env:
          CGO_ENABLED: '0'
        run: go test -v -coverprofile=profile.cov ./...

      - name: Run go vet without CGO
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Run adapter module tests without CGO
        working-directory: adapter
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Run adapter module vet without CGO
        working-directory: adapter
        env:
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: Generate coverage report
        run: go tool cover -html=profile.cov -o coverage.html

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  compatibility-manifest:
    name: Phase 0 compatibility manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate baseline manifest
        env:
          CGO_ENABLED: '0'
        run: go test ./compat -run TestBaselineManifestIsComplete -count=1

  baseline:
    name: Locked upstream baseline tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run locked baseline root and adapter tests
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          baseline_dir=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$baseline_dir" || true
          }
          trap cleanup EXIT
          git merge-base --is-ancestor "$BASELINE_COMMIT" "$GITHUB_SHA"
          git worktree add --detach "$baseline_dir" "$BASELINE_COMMIT"
          (cd "$baseline_dir" && go test ./...)
          (cd "$baseline_dir/adapter" && go test ./...)

  compatibility-diff:
    name: Baseline/current compatibility diff
    needs: [test, baseline, compatibility-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run executable compatibility gate
        env:
          CGO_ENABLED: '0'
        run: go run ./compat/cmd verify --baseline "$BASELINE_COMMIT" --report compat-report.json

      - name: Upload compatibility report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: compat-report.json
          if-no-files-found: ignore

  pure-go-build:
    name: Pure Go build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [frontend, test, baseline, compatibility-manifest, compatibility-diff]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -o "build/ddbot-ai-${GOOS}-${GOARCH}${suffix}" ./cmd

      - name: Compile SQLite foundation without CGO
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -buildmode=archive -o "build/platformdb-${GOOS}-${GOARCH}.a" ./internal/platformdb

      - name: Compile platform foundations without CGO
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          for package in secretstore auth adminauth adminapi buildinfo webui session csrf origin; do
            go build -trimpath -buildmode=archive -o "build/${package}-${GOOS}-${GOARCH}.a" "./internal/${package}"
          done

      - name: Verify build artifact exists
        shell: bash
        run: |
          suffix=""
          if [ "${{ matrix.goos }}" = "windows" ]; then suffix=".exe"; fi
          test -f "build/ddbot-ai-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}"

      - name: Upload pure Go artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddbot-ai-${{ matrix.goos }}-${{ matrix.goarch }}-lite
          path: build/ddbot-ai-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
